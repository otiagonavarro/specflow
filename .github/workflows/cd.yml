# Este repo é uma ferramenta local (CLI + servidor Express) sem alvo de deploy
# hospedado — não há Dockerfile, Cloud Run, Vercel, etc.
#
# Por isso o "CD" aqui não é deploy de serviço, é *entrega*: ao empurrar uma tag
# `vX.Y.Z` (igual à versão do package.json), builda o frontend, empacota `dist/`,
# cria uma GitHub Release com o trecho correspondente do CHANGELOG.md e publica
# o pacote `@otiagonavarro/specflow` no GitHub Packages (não no npmjs.org).

name: CD

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client (tsconfig.json)
        run: npm run lint

      - name: Typecheck server (tsconfig.server.json)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Build (vite build)
        run: npm run build

      - name: Package dist as zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "specflow-${VERSION:-dev}.zip" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: '*.zip'
          retention-days: 14

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<EOF'
            awk -v ver="$VERSION" '
              BEGIN { found=0 }
              /^## / { if (found) exit; if ($0 ~ ver) found=1; next }
              found { print }
            ' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          body: ${{ steps.notes.outputs.body || format('Release {0}', github.ref_name) }}
          generate_release_notes: true

  publish-package:
    name: Publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          scope: '@otiagonavarro'

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
